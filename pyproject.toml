[project]
name = "allograph-clustering"
version = "0.0.1"
description = "Allograph induction for one character: its crops clustered by stroke shape, named as categories and labelled"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "numpy>=2",
    "pillow>=11",
    "pyyaml>=6",
    "scikit-image>=0.26",
    "scikit-learn>=1.7",
    "scipy>=1.16",
    "typer>=0.16",
    "umap-learn>=0.5",
]

[project.optional-dependencies]
# Restoration and encoder training (`allograph-clustering cluster`). Labelling a finished run does not need it.
train = ["torch>=2.14", "timm>=1.0"]

[project.scripts]
allograph-clustering = "allograph_clustering.cli:app"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.12"]

[tool.ruff]
line-length = 140

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
