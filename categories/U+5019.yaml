notes:
  - >-
    The first split of the shape tree is written 候 (L1–L5) against the abbreviations. The abbreviations
    then divide into branched and kinked strokes (L6–L12), where ん/h and the zigzag are siblings, and
    single contained strokes (L13–L24).
  - >-
    Full, half-cursive and cursive 候 grade into each other and are annotated as one category; only the
    three abbreviations get categories of their own.
  - >-
    Short kinked strokes sit on the border of zigzag and contained stroke, and some classifier clusters split
    between the two (C14, C28).
